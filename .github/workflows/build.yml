name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 固定 debug 签名密钥：CI 每次全新 VM，AGP 默认密钥每次都不同，
      # 升级安装会因签名不匹配失败 → 必须先卸载 → 现场数据全丢。
      # 这里生成一份固定密钥并缓存复用（首次生成后落盘，此后 cache hit）。
      - name: Restore stable debug keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: keystore/debug.jks
          key: stable-debug-keystore-v1

      - name: Generate stable debug keystore if missing
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/debug.jks \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=CN"

      - name: Verify keystore exists
        run: ls -la keystore/

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
