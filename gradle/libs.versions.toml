[versions]
agp = "8.7.3"
kotlin = "2.1.10"
composeBom = "2025.06.00"
coreKtx = "1.15.0"
lifecycle = "2.9.0"
navigation = "2.8.9"
room = "2.7.1"
ksp = "2.1.10-1.0.31"
cameraX = "1.4.1"
workmanager = "2.9.1"
gson = "2.11.0"
